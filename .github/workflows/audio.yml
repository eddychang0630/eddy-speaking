name: Build Kokoro audio

# 新增或修改課程後，自動用 Kokoro 產生自然語音 MP3，推回 main 並重新部署 Pages
on:
  push:
    branches: [main]
    paths: ['lessons/**', 'tools/build_audio.py', '.github/workflows/audio.yml']
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: kokoro-audio
  cancel-in-progress: false

jobs:
  audio:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ffmpeg and eSpeak
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg espeak-ng

      - name: Cache pip and Kokoro model
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/huggingface
          key: kokoro-${{ runner.os }}-py311-v1

      - name: Install Kokoro (CPU)
        run: |
          pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet kokoro soundfile

      - name: Generate audio
        run: python tools/build_audio.py --kokoro-home none

      - name: Commit audio and redeploy Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add audio
          if git diff --cached --quiet; then echo "音檔沒有變更"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update Kokoro audio"
          git pull --rebase
          git push
          # 用 GITHUB_TOKEN 推送不會自動觸發 Pages 部署，手動請求一次
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Pages 會在下一次推送時部署"
